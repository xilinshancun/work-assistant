name: Validate or publish a tagged release

# Dispatch on the actual tag: gh workflow run release.yml --ref v0.1.0a1
#   -f version=0.1.0a1 -f tag=v0.1.0a1 -f publish=false
# A normal push, including a tag push, never uploads a package.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact package version (for example 0.1.0a1)
        required: true
        type: string
      tag:
        description: Actual dispatch tag, exactly vVERSION
        required: true
        type: string
      publish:
        description: Upload the validated artifacts to PyPI (false validates only)
        required: true
        default: false
        type: boolean

permissions:
  contents: read
concurrency:
  group: pypi-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      artifact-id: ${{ steps.bundle.outputs.artifact-id }}
      commit: ${{ steps.identity.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Check exact dispatch tag, versions and main ancestry
        id: identity
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          python - <<'PY'
          import os
          from scripts.package_smoke import validate_release
          identity = validate_release(os.environ['RELEASE_VERSION'], os.environ['RELEASE_TAG'], os.environ['GITHUB_REF'])
          if identity['commit'] != os.environ['GITHUB_SHA']:
              raise ValueError('dispatch SHA differs from checked tag')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              stream.write('commit=' + identity['commit'] + '\n')
          PY
      - run: python -m pip install build twine
      - name: Build once and check metadata
        run: |
          python -m build --outdir out/release-bundle/dist
          python -m twine check --strict out/release-bundle/dist/*
      - name: Audit distributions and freeze hashes
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          python scripts/package_smoke.py --audit-only --artifacts out/release-bundle/dist \
            --release-version "$RELEASE_VERSION" --release-tag "$RELEASE_TAG" \
            --release-ref "$GITHUB_REF" --manifest out/release-bundle/release-manifest.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: bundle
        with:
          name: release-bundle-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/release-bundle/
          if-no-files-found: error
          retention-days: 14

  validate:
    name: Test and install / ${{ matrix.os }} / Python ${{ matrix.python }}
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
        python: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          merge-multiple: true
          path: candidate
      - name: Verify the exact build bundle
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_COMMIT: ${{ needs.build.outputs.commit }}
        run: |
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path('candidate')
          manifest = json.loads((root / 'release-manifest.json').read_text())
          assert manifest['schema'] == 'wa.release.bundle.v1'
          assert (manifest['version'], manifest['tag'], manifest['commit']) == (
              os.environ['RELEASE_VERSION'], os.environ['RELEASE_TAG'], os.environ['RELEASE_COMMIT'])
          entries = manifest['artifacts']
          assert len(entries) == 2 and len({e['artifact'] for e in entries}) == 2
          assert sum(e['artifact'].endswith('.whl') for e in entries) == 1
          assert sum(e['artifact'].endswith('.tar.gz') for e in entries) == 1
          assert {p.name for p in (root / 'dist').iterdir()} == {e['artifact'] for e in entries}
          for entry in entries:
              name = entry['artifact']
              assert Path(name).name == name and entry['version'] == manifest['version']
              assert hashlib.sha256((root / 'dist' / name).read_bytes()).hexdigest() == entry['sha256']
          PY
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q work_assistant
      - run: python -m work_assistant demo --output out/release-demo
      - run: python scripts/package_smoke.py --artifacts candidate/dist --output out/release-smoke
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: release-evidence-${{ matrix.os }}-${{ matrix.python }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/release-smoke/
          if-no-files-found: warn
          retention-days: 14

  publish:
    if: ${{ inputs.publish }}
    needs: [build, validate]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/local-work-assistant
    # No source checkout, build, install or test code runs with this permission.
    permissions:
      id-token: write
    steps:
      - name: Require a fresh explicitly dispatched publishing attempt
        run: |
          test "$GITHUB_RUN_ATTEMPT" = 1 || {
            echo 'Do not rerun an uncertain upload. Inspect PyPI and the prior run first; use a new authorized dispatch.' >&2
            exit 1
          }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          merge-multiple: true
          path: candidate
      - name: Verify the exact validated pair without loading package code
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_COMMIT: ${{ needs.build.outputs.commit }}
        run: |
          python3 -I - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path('candidate')
          manifest = json.loads((root / 'release-manifest.json').read_text())
          assert manifest['schema'] == 'wa.release.bundle.v1'
          assert (manifest['version'], manifest['tag'], manifest['commit']) == (
              os.environ['RELEASE_VERSION'], os.environ['RELEASE_TAG'], os.environ['RELEASE_COMMIT'])
          assert os.environ['GITHUB_REF'] == 'refs/tags/' + manifest['tag']
          entries = manifest['artifacts']
          assert len(entries) == 2 and len({e['artifact'] for e in entries}) == 2
          assert sum(e['artifact'].endswith('.whl') for e in entries) == 1
          assert sum(e['artifact'].endswith('.tar.gz') for e in entries) == 1
          assert {p.name for p in (root / 'dist').iterdir()} == {e['artifact'] for e in entries}
          for entry in entries:
              name = entry['artifact']
              assert Path(name).name == name and entry['version'] == manifest['version']
              assert hashlib.sha256((root / 'dist' / name).read_bytes()).hexdigest() == entry['sha256']
          PY
      - name: Publish the validated wheel and sdist with Trusted Publishing
        # Official v1.14.3 tag peeled via git ls-remote and checked against its
        # immutable release: https://github.com/pypa/gh-action-pypi-publish/releases/tag/v1.14.3
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: candidate/dist/
          skip-existing: 'false'
          verify-metadata: 'true'
          print-hash: 'true'
          attestations: 'true'
